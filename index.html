<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>rimbook</title>
<style>
:root{--bg:#090d16;--card:#111827;--in:#070b12;--bd:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ac:#22d3ee;--p:#2563eb;--ok:#10b981;--bad:#f43f5e;--warn:#f59e0b}
[data-theme=light]{--bg:#f4f6fb;--card:#fff;--in:#f1f5f9;--bd:#e2e8f0;--tx:#1e293b;--mu:#64748b;--ac:#0891b2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 84px;font-family:system-ui,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{margin:0;font-size:20px;color:var(--ac);font-family:Georgia,serif;letter-spacing:1px}
main{max-width:520px;margin:auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:4px 0;overflow-x:auto}
nav button{background:none;color:var(--mu);border:0;font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 6px;cursor:pointer;flex:1;min-width:56px}
nav button span{font-size:17px}
nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 .card{margin:0;padding:10px 6px}
.grid3 h3{margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,textarea{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);max-width:100%}
button{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--bd);background:var(--in);color:var(--tx);padding:7px 12px;border-radius:10px}
button.p,button.on{background:var(--p);border-color:var(--p);color:#fff}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.item>span{flex:1}
.item.done span{text-decoration:line-through;color:var(--mu)}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--bd)}
.muted{color:var(--mu);font-size:12px}
.hi{color:var(--bad)}
.ok{color:var(--ok)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:90%}
.mic{position:fixed;bottom:80px;left:16px;z-index:30;width:56px;height:56px;border-radius:50%;background:var(--p);color:#fff;font-size:24px;border:0;box-shadow:0 4px 16px rgba(37,99,235,.4);cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body data-theme="dark">
<header>
  <h1>rimbook</h1>
</header>
<main id="view"></main>
<button id="micBtn" class="mic" onclick="voiceCapture()">🎤</button>
<nav id="tabs"></nav>

<!-- استدعاء ملف الجافاسكريبت مرة واحدة فقط -->
<script src="app.js"></script>
</body>
</html>
