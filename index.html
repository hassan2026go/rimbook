<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="rimbook - مفكرة شاملة ذكية بالصوت">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./rimbook-icon-192x192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./rimbook-icon-192x192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>rimbook</title>
<style>
:root{--bg:#090d16;--card:#111827;--in:#070b12;--bd:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ac:#22d3ee;--p:#2563eb;--ok:#10b981;--bad:#f43f5e;--warn:#f59e0b}
[data-theme=light]{--bg:#f4f6fb;--card:#fff;--in:#f1f5f9;--bd:#e2e8f0;--tx:#1e293b;--mu:#64748b;--ac:#0891b2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 84px;font-family:system-ui,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{margin:0;font-size:20px;color:var(--ac);font-family:Georgia,serif;letter-spacing:1px}
.hdr{display:flex;gap:8px;align-items:center}
#net{font-size:11px;color:var(--mu)}
main{max-width:520px;margin:auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:4px 0;overflow-x:auto}
nav button{background:none;color:var(--mu);border:0;font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 6px;cursor:pointer;flex:1;min-width:56px}
nav button span{font-size:17px}
nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card>b,.card>h2{display:block;margin-bottom:8px;color:var(--ac);font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 .card{margin:0;padding:10px 6px}
.grid3 h3{margin:4px 0}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid2 .card{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.strip button{min-width:52px}
input,select,textarea{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);max-width:100%}
textarea{resize:vertical}
button{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--bd);background:var(--in);color:var(--tx);padding:7px 12px;border-radius:10px}
button.p,button.on{background:var(--p);border-color:var(--p);color:#fff}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.4}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.item>span{flex:1}
.item.done span{text-decoration:line-through;color:var(--mu)}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--bd)}
.tag.ok{background:var(--ok);color:#fff}
.tag.bad{background:var(--bad);color:#fff}
.tag.warn{background:var(--warn);color:#fff}
.muted{color:var(--mu);font-size:12px}
.hi{color:var(--bad)}
.ok{color:var(--ok)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:90%}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);background:var(--bd);display:inline-flex;align-items:center;justify-content:center;font-size:40px}
audio{width:100%;margin-top:8px}
.mic{position:fixed;bottom:80px;left:16px;z-index:30;width:56px;height:56px;border-radius:50%;background:var(--p);color:#fff;font-size:24px;border:0;box-shadow:0 4px 16px rgba(37,99,235,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.mic.rec{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--in);border:1px solid var(--bd);font-size:11px;margin:2px}
.progress{height:8px;background:var(--in);border-radius:99px;overflow:hidden;margin:6px 0}
.progress>div{height:100%;background:linear-gradient(90deg,var(--ac),var(--p));transition:width .3s}
canvas{max-width:100%}
details summary{cursor:pointer;padding:4px 0}
pre{overflow-x:auto}
@media print{header,nav,.mic{display:none}}
</style>
</head>
<body data-theme="dark">
<header>
  <h1>rimbook</h1>
  <div class="hdr">
    <span id="net"></span>
    <button id="btnInstall" class="p" type="button" hidden>📲 تثبيت التطبيق</button>
  </div>
</header>
<main id="view"></main>
<button id="micBtn" class="mic" onclick="voiceCapture()" aria-label="التسجيل الصوتي">🎤</button>
<nav id="tabs"></nav>

<script src="./app.js"></script>
<script src="./sync.js"></script>
<script src="./business.js"></script>
<script src="./integrations.js"></script>
<script src="./charts.js"></script>
<script src="./push.js"></script>
<script src="./invoices.js"></script>
<script src="./currency.js"></script>
<script src="./contacts.js"></script>
<script src="./attachments.js"></script>
<script src="./tts.js"></script>
<script src="./i18n.js"></script>
<script src="./ai-suggest.js"></script>
<script src="./crypto.js"></script>
<script src="./compare.js"></script>
<script>
(() => {
  let installEvent = null;
  const button = document.getElementById("btnInstall");
  const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const refreshInstallButton = () => { button.hidden = isStandalone(); };
  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    installEvent = event;
    refreshInstallButton();
  });
  window.addEventListener("appinstalled", () => {
    installEvent = null;
    button.hidden = true;
    if (typeof toast === "function") toast("تم تثبيت Rimbook بنجاح");
  });
  button.addEventListener("click", async () => {
    if (installEvent) {
      installEvent.prompt();
      await installEvent.userChoice;
      installEvent = null;
      refreshInstallButton();
      return;
    }
    if (window.matchMedia("(display-mode: standalone)").matches) return;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    alert(ios
      ? "لتثبيت Rimbook: اضغط مشاركة في Safari ثم اختر إضافة إلى الشاشة الرئيسية."
      : "إذا لم يظهر مربع التثبيت، افتح قائمة المتصفح ⋮ ثم اختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية.");
  });
  refreshInstallButton();
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js", {scope:"./"})
        .then(() => { const n=document.getElementById("net"); if(n) n.textContent="جاهز للعمل دون اتصال"; })
        .catch(err => console.error("Service Worker:", err));
    });
  }
})();
</script>
</body>
</html>
