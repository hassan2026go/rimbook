name: Build Rimbook Android Preview

on:
  push:
    branches:
      - feature/storage-integrity-protection
    paths:
      - '**'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Prepare local web assets
        run: |
          mkdir -p www
          cp index.html *.js *.webmanifest *.png www/

      - name: Generate Android project
        run: npx cap add android

      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace("<application", permission + "    <application", 1)
          p.write_text(s)
          PY

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Rimbook-Android-Preview-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
